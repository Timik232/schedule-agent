version: "3.9"

services:
  database:
    image: postgres:16-alpine
    container_name: schedule-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: schedule
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - schedule-db-data:/var/lib/postgresql/data
      - "./min (1).db:/docker-entrypoint-initdb.d/min.db:ro"

  schedule-agent:
    build: .
    image: schedule-agent:latest
    container_name: schedule-agent
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://schedule:schedule@database:5432/schedule
      LLM_PROVIDER: ${LLM_PROVIDER:-copilot}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-https://api.githubcopilot.com}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini-copilot}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8080:8080"
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8080
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

volumes:
  schedule-db-data:
